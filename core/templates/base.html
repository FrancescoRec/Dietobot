{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4e190">
    <title>{% block title %}DietoBot{% endblock %}</title>
    <style>
        :root {
            --background: #f4e190;
            --surface: #fffdf5;
            --surface-strong: #ffffff;
            --text: #2d211b;
            --muted: #71645b;
            --border: #dfc978;
            --primary: #c92f35;
            --primary-hover: #a92329;
            --accent: #347a43;
            --focus: #1769aa;
            --shadow: 0 14px 36px rgba(83, 56, 22, 0.14);
        }

        * { box-sizing: border-box; }

        html { min-height: 100%; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            line-height: 1.5;
        }

        a { color: inherit; }

        button,
        input { font: inherit; }

        :focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        .logout-form {
            position: fixed;
            z-index: 20;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
        }

        .logout-button {
            min-height: 36px;
            border: 1px solid rgba(45, 33, 27, 0.2);
            border-radius: 6px;
            background: rgba(255, 253, 245, 0.94);
            color: var(--text);
            cursor: pointer;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(83, 56, 22, 0.1);
        }

        .logout-button:hover { background: var(--surface-strong); }

        .page-content {
            width: min(920px, calc(100% - 32px));
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 72px 0 32px;
        }

        .page-heading { margin-bottom: 24px; }

        .page-heading h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            line-height: 1.15;
        }

        .page-heading p { margin: 0; color: var(--muted); }

        .eyebrow {
            color: var(--accent) !important;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 8px !important;
            text-transform: uppercase;
        }

        .button {
            min-height: 46px;
            border: 1px solid transparent;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 800;
            text-decoration: none;
            transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .button-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(169, 35, 41, 0.22);
        }

        .button-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .home-page {
            min-height: calc(100vh - 104px);
            min-height: calc(100dvh - 104px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            text-align: center;
        }

        .home-logo {
            display: block;
            width: min(100%, 620px);
            max-height: 66vh;
            max-height: 66dvh;
            object-fit: contain;
        }

        .home-cta {
            width: min(100%, 360px);
            min-height: 64px;
            font-size: 1.2rem;
        }

        .auth-page,
        .chat-page { margin: 0 auto; }

        .auth-page { max-width: 440px; }

        .auth-form,
        .chat-window {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .auth-form { padding: 24px; }
        .auth-form p { margin: 0 0 18px; }
        .auth-form label { display: block; margin-bottom: 6px; font-weight: 700; }

        .auth-form input,
        .chat-form input {
            width: 100%;
            min-width: 0;
            min-height: 46px;
            border: 1px solid #b6a66c;
            border-radius: 7px;
            background: var(--surface-strong);
            color: var(--text);
            padding: 10px 13px;
        }

        .auth-form input:focus,
        .chat-form input:focus { border-color: var(--focus); }

        .auth-form .helptext,
        .auth-form ul {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .auth-form .button { width: 100%; }

        .auth-switch {
            color: var(--muted);
            margin-top: 20px;
            text-align: center;
        }

        .auth-switch a { color: var(--primary-hover); font-weight: 700; }

        .chat-page { max-width: 760px; }

        .chat-title {
            margin: 0 0 24px;
            text-align: center;
            font-size: 2.75rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0;
        }

        .chat-window {
            min-height: 360px;
            max-height: 58vh;
            max-height: 58dvh;
            overflow-y: auto;
            padding: 24px;
        }

        .message { max-width: 520px; }
        .message + .message { margin-top: 18px; }
        .message strong { font-size: 0.82rem; }

        .message p {
            overflow-wrap: anywhere;
            margin: 6px 0 0;
            white-space: pre-line;
        }

        .message-user {
            margin-left: auto;
            border-radius: 8px;
            background: #f4d7d4;
            padding: 13px 15px;
        }

        .message-bot {
            border-left: 3px solid var(--accent);
            padding: 4px 0 4px 15px;
        }

        .chat-form {
            position: sticky;
            bottom: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            margin-top: 12px;
            padding-bottom: max(0px, env(safe-area-inset-bottom));
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 600px) {
            .page-content {
                width: min(100% - 24px, 920px);
                padding-top: 62px;
                padding-bottom: 20px;
            }

            .page-heading { margin-bottom: 18px; }
            .page-heading h1 { font-size: 1.7rem; }
            .chat-title { margin-bottom: 20px; font-size: 2.25rem; }

            .home-page {
                min-height: calc(100dvh - 82px);
                gap: 20px;
            }

            .home-logo {
                width: min(100%, 520px);
                max-height: 62dvh;
            }

            .home-cta { min-height: 58px; }

            .auth-form,
            .chat-window { padding: 18px; }

            .chat-window {
                min-height: 46dvh;
                max-height: 60dvh;
            }

            .chat-form .button { padding-inline: 16px; }
        }

        @media (max-width: 360px) {
            .page-content { width: min(100% - 16px, 920px); }
            .logout-form { right: 8px; }
            .auth-form, .chat-window { padding: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .button { transition: none; }
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
        <form class="logout-form" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="logout-button" type="submit">Log out</button>
        </form>
    {% endif %}

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
