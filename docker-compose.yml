services:
  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/adc.json
    env_file:
      - .env
    depends_on:
      - db
    command: bash -c "python manage.py migrate --settings=config.settings.local && python manage.py runserver 0.0.0.0:8000 --settings=config.settings.local"

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=dietobot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"

volumes:
  postgres_data:
